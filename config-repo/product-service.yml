server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:productdb

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost
    instance-id: localhost:product-service:${server.port}
    prefer-ip-address: false