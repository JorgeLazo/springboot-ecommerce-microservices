server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:userdb

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

  instance:
    hostname: localhost
    instance-id: localhost:user-service:${server.port}